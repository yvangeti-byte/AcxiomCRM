{% extends "base.html" %}

{% block content %}

<div class="card form-card">

    <h1>Add New Customer</h1>

    <p class="muted">
        Enter the customer information below.
    </p>


    <form
        method="POST"
        onsubmit="return validateCustomerForm();"
    >

        <!-- NAME -->

        <label for="name">
            Customer Name *
        </label>

        <input
            type="text"
            id="name"
            name="name"
            maxlength="150"
            required
            placeholder="Enter customer name"
        >


        <!-- EMAIL -->

        <label for="email">
            Email *
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="customer@example.com"
        >


        <!-- PHONE -->

        <label for="phone">
            Phone *
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            minlength="10"
            maxlength="15"
            required
            placeholder="9876543210"
        >


        <!-- ADDRESS -->

        <label for="address">
            Address
        </label>

        <input
            type="text"
            id="address"
            name="address"
            maxlength="250"
            placeholder="Customer address"
        >


        <!-- STATUS -->

        <label for="status">
            Status
        </label>

        <select
            id="status"
            name="status"
        >

            <option value="Active">
                Active
            </option>

            <option value="Inactive">
                Inactive
            </option>

            <option value="Prospect">
                Prospect
            </option>

        </select>


        <!-- NOTES -->

        <label for="notes">
            Notes
        </label>

        <textarea
            id="notes"
            name="notes"
            placeholder="Additional customer information"
        ></textarea>


        <!-- BUTTONS -->

        <button type="submit">
            Create Customer
        </button>

        <a
            class="btn"
            href="{{ url_for('customers') }}"
        >
            Cancel
        </a>

    </form>

</div>


<script>

function validateCustomerForm() {

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();


    if (!email.includes("@") || !email.includes(".")) {

        alert("Please enter a valid email address.");

        return false;
    }


    if (!/^[0-9]+$/.test(phone)) {

        alert("Phone number must contain only digits.");

        return false;
    }


    if (phone.length < 10) {

        alert("Phone number must contain at least 10 digits.");

        return false;
    }


    if (phone.length > 15) {

        alert("Phone number cannot exceed 15 digits.");

        return false;
    }


    return true;
}

</script>

{% endblock %}
